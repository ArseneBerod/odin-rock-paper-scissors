<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="./css/style.css">
		<title>Rock Paper Scissors</title>
		<script type="module" src="./script.js"></script>
	</head>
	<body>
		<div class="title">ROCK - PAPER - SCISSORS</div>
		<div class="scoreboard">
			<div class="player" id="player1">
				<div class="name">Human</div>
				<div class="score">0</div>
			</div>
			<div class="player" id="player2">
				<div class="name">Computer</div>
				<div class="score">0</div>
			</div>
		</div>
		<div class="game-area">
			<div class="round-move">
				<img src="./images/question-mark.svg" alt="question-mark" id="choice1">
				<img src="./images/question-mark.svg" alt="question-mark" id="choice2">
			</div>
			<div class="round-result"></div>
		</div>
		<div class = "controler">
			<button class="rock"><img src="./images/rock.svg" alt="rock-emoji"></button>
			<button class="paper"><img src="./images/paper.svg" alt="paper-emoji"></button>
			<button class="scissors"><img src="./images/scissors.svg" alt="scissors-emoji"></button>
		</div>
	</body>
</html>
